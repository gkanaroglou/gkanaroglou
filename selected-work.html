<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>Prototype: Selected work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400..700&display=swap" rel="stylesheet">
<style>
  /* Site tokens, copied from index.html */
  :root {
    --surface: #111111; --raised: #1A1A1A; --text: #F5F5F5; --muted: #A3A3A3;
    --line: #2A2A2A; --primary: #0077BC; --secondary: #009866;
    --display: "Archivo Black", "Arial Black", Impact, sans-serif;
    --body: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-tap-highlight-color: transparent; }
  body { background: var(--surface); color: var(--text); font-family: var(--body); font-size: 1.0625rem; line-height: 1.55; padding-bottom: 6rem; }
  .wrap { width: min(1200px, 100% - 2 * clamp(1.25rem, 4vw, 3rem)); margin-inline: auto; }
  h2, h3 { text-wrap: balance; } p { text-wrap: pretty; }

  /* Surrounding context: the homepage strip above, the contact section below */
  .ctx-top { padding-block: 1.5rem; }
  .ctx-mark { display: inline-flex; align-items: center; gap: .6rem; font-family: var(--display); font-size: 1.5rem; }
  .livery { display: inline-flex; gap: .2rem; }
  .livery i { display: block; width: .5rem; height: 1.35rem; transform: skewX(-18deg); }
  .livery i:first-child { background: var(--primary); } .livery i:last-child { background: var(--secondary); }
  .ctx-strip { overflow: hidden; padding-block: 1.1rem; background: var(--primary); color: #FFF; white-space: nowrap;
    font-family: var(--display); font-size: clamp(1.1rem, 2.2vw, 1.6rem); padding-left: 1.25rem; }
  .ctx-contact { padding-block: clamp(3rem, 7vw, 5.5rem); }
  .ctx-contact p { color: var(--muted); margin-bottom: .75rem; }
  .ctx-contact span { font-family: var(--display); font-size: clamp(1.15rem, 4vw, 2.75rem); border-bottom: 4px solid var(--primary); overflow-wrap: anywhere; }

  /* Shared by all variants */
  .work { padding-block: clamp(3rem, 7vw, 5.5rem) 0; }
  .work-title { font-family: var(--display); font-weight: 400; letter-spacing: -.02em; font-size: clamp(1.6rem, 4vw, 2.6rem); line-height: 1.05; margin-bottom: clamp(1.5rem, 4vw, 2.5rem); }
  .work ul { list-style: none; }

  /* ---------- 1. Scoreboard: the number leads ---------- */
  .score li {
    display: grid; grid-template-columns: minmax(0, 24rem) minmax(0, 1fr); gap: 1rem 3rem;
    align-items: baseline; padding-block: clamp(1.5rem, 3vw, 2.25rem); border-top: 1px solid var(--line);
  }
  .score li:last-child { border-bottom: 1px solid var(--line); }
  .score .stat { white-space: nowrap; font-family: var(--display); font-size: clamp(2.25rem, 5.5vw, 4rem); line-height: .95; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .score .stat-label { display: block; margin-top: .5rem; font-family: var(--body); font-size: .9rem; letter-spacing: 0; color: var(--muted); }
  .score h3 { font-size: clamp(1.15rem, 1.8vw, 1.4rem); line-height: 1.25; font-weight: 700; margin-bottom: .4rem; }
  .score p { max-width: 52ch; }
  .score .meta { margin-top: .6rem; color: var(--muted); font-size: .92rem; }
  @media (max-width: 760px) { .score li { grid-template-columns: 1fr; } }

  /* ---------- 2. Dossier: depth on demand ---------- */
  .cases { border-top: 1px solid var(--line); }
  .cases li { border-bottom: 1px solid var(--line); }
  .case-toggle {
    display: grid; grid-template-columns: minmax(0, 1fr) auto 2rem; gap: 1rem 2rem; align-items: center;
    width: 100%; min-height: 4.5rem; padding-block: 1.25rem; text-align: left; cursor: pointer;
    font: inherit; color: var(--text); background: none; border: 0;
    touch-action: manipulation; -webkit-user-select: none; user-select: none;
  }
  .case-toggle:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  .case-toggle h3 { font-family: var(--display); font-weight: 400; font-size: clamp(1.25rem, 2.6vw, 1.85rem); line-height: 1.1; letter-spacing: -.01em; }
  .case-result { color: var(--muted); font-weight: 600; font-size: .95rem; text-align: right; }
  .case-icon { position: relative; width: 1.1rem; height: 1.1rem; justify-self: end; transition: transform 200ms var(--ease-out); }
  .case-icon::before, .case-icon::after { content: ""; position: absolute; inset: 50% 0 auto; height: 3px; margin-top: -1.5px; background: var(--primary); }
  .case-icon::after { transform: rotate(90deg); }
  .case-toggle[aria-expanded="true"] .case-icon { transform: rotate(45deg); }
  .case-toggle:active h3 { opacity: .7; }
  /* Accordion: rows grow to their content height (the one place a size change is the right tool) */
  .case-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 200ms var(--ease-out); }
  .case-panel[data-open] { grid-template-rows: 1fr; }
  .case-panel > div { overflow: hidden; }
  .case-body { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.5rem 2.5rem; padding: .25rem 0 2rem; opacity: 0; transition: opacity 200ms var(--ease-out); }
  .case-panel[data-open] .case-body { opacity: 1; }
  .case-body h4 { color: var(--muted); font-size: .88rem; font-weight: 600; margin-bottom: .35rem; }
  .case-body p { max-width: 40ch; }
  @media (max-width: 760px) {
    .case-toggle { grid-template-columns: minmax(0, 1fr) 2rem; }
    .case-result { grid-column: 1; grid-row: 2; text-align: left; margin-top: -.5rem; }
    .case-icon { grid-row: 1 / span 2; }
    .case-body { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    .case-panel, .case-icon { transition: none; }
  }

  /* ---------- 3. Livery: browse by look ---------- */
  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.25rem; }
  .card {
    position: relative; display: flex; flex-direction: column; gap: .75rem; min-height: 22rem;
    padding: 1.75rem 2.25rem 1.75rem 2.25rem; background: var(--raised);
    clip-path: polygon(7% 0, 100% 0, 93% 100%, 0 100%);
  }
  .card .livery { margin-bottom: .5rem; }
  .card .area { color: var(--muted); font-size: .9rem; font-weight: 600; }
  .card h3 { font-family: var(--display); font-weight: 400; font-size: clamp(1.3rem, 2vw, 1.6rem); line-height: 1.1; letter-spacing: -.01em; }
  .card p { font-size: .98rem; }
  .card .stat { margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--line); font-family: var(--display); font-size: 2rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .card .stat small { display: block; font-family: var(--body); font-size: .85rem; color: var(--muted); letter-spacing: 0; }
  /* Phones: a native swipe rail with snapping, no custom gesture code */
  @media (max-width: 860px) {
    .cards { display: flex; gap: .75rem; overflow-x: auto; scroll-snap-type: x mandatory; overscroll-behavior-x: contain;
      margin-inline: calc(-1 * clamp(1.25rem, 4vw, 3rem)); padding-inline: clamp(1.25rem, 4vw, 3rem); scroll-padding-inline: clamp(1.25rem, 4vw, 3rem); scrollbar-width: none; }
    .cards::-webkit-scrollbar { display: none; }
    .card { flex: 0 0 82%; scroll-snap-align: start; min-height: 24rem; }
    .rail-hint { display: block; margin-top: 1rem; color: var(--muted); font-size: .9rem; }
  }
  .rail-hint { display: none; }

  /* ---------- Picker: verbatim from PICKER.md ---------- */
  .proto-picker { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10, 10, 10, 0.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 8px 24px rgba(0, 0, 0, 0.24), 0 2px 6px rgba(0, 0, 0, 0.12); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
  .proto-picker-highlight { position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); will-change: transform; }
  .proto-picker[data-ready] .proto-picker-highlight { transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1), width 250ms cubic-bezier(0.23, 1, 0.32, 1); }
  @media (prefers-reduced-motion: reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition: none; } }
  .proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255, 255, 255, 0.55); font: inherit; cursor: pointer; transition: color 150ms ease-out; }
  .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
  .proto-picker-item:active { transform: scale(0.97); }
  .proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
  .proto-picker-item[data-active] { color: #fff; }
  .proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
  .proto-picker-replay { padding: 0 10px; font-size: 14px; }
  .proto-picker[data-position="top"] { bottom: auto; top: 24px; }
</style>
</head>
<body>

<header class="ctx-top"><div class="wrap"><span class="ctx-mark"><span class="livery" aria-hidden="true"><i></i><i></i></span>GK</span></div></header>
<div class="ctx-strip" aria-hidden="true">Pricing strategy &nbsp;/&nbsp; Brand strategy &nbsp;/&nbsp; Digital marketing &nbsp;/&nbsp; Marketing analytics &nbsp;/&nbsp; Consumer psychology</div>

<main id="stage"></main>

<section class="ctx-contact"><div class="wrap"><p>Want to work together or talk marketing?</p><span>hello@georgekanaroglou.com</span></div></section>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Scoreboard</button>
  <button class="proto-picker-item">Dossier</button>
  <button class="proto-picker-item">Livery</button>
</nav>

<script>
/* Real content only: facts George has stated. */
var WORK = [
  { title: "What drives motorsport fans to engage online",
    line: "Undergraduate dissertation on the factors behind fan engagement across motorsport’s digital platforms.",
    meta: "Dissertation, University of Kent", area: "Consumer psychology",
    stat: "78%", statLabel: "Dissertation mark",
    q: "Which factors drive fan engagement across motorsport’s digital platforms?",
    how: "An undergraduate research project at the University of Kent.",
    out: "Marked 78%, as part of a First Class degree." },
  { title: "Pricing a smart cooker before launch",
    line: "Pricing research for LUMO, a smart cooker, to set the launch price and decide how many versions to sell.",
    meta: "Group project with LSE classmates", area: "Pricing strategy",
    stat: "£149 / £199", statLabel: "Two-tier launch price",
    q: "What should a new smart cooker cost, and in how many versions?",
    how: "A choice-based conjoint study and a Van Westendorp price sensitivity survey.",
    out: "A two-tier launch, at £149 and £199." },
  { title: "Growing a Google Ads account fifteenfold",
    line: "Managed search campaigns in a Google Ads simulation, from a small start to a profitable account.",
    meta: "Google Ads simulation", area: "Digital marketing",
    stat: "15×", statLabel: "Revenue growth, $4.1k to $61.7k",
    q: "How far could the account grow over the simulation?",
    how: "Managed and optimised search campaigns in a Google Ads simulation.",
    out: "Revenue grew from about $4,100 to $61,700. Peak ROAS 5.27. Scored 100/100." }
];
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

var variants = [
  function () {
    return '<section class="work"><div class="wrap"><h2 class="work-title">Selected work</h2><ul class="score">' +
      WORK.map(function (w) {
        return '<li><p class="stat">' + esc(w.stat) + '<span class="stat-label">' + esc(w.statLabel) + '</span></p>' +
          '<div><h3>' + esc(w.title) + '</h3><p>' + esc(w.line) + '</p><p class="meta">' + esc(w.meta) + '</p></div></li>';
      }).join("") + '</ul></div></section>';
  },
  function () {
    return '<section class="work"><div class="wrap"><h2 class="work-title">Selected work</h2><ul class="cases">' +
      WORK.map(function (w, i) {
        return '<li><button type="button" class="case-toggle" aria-expanded="false" aria-controls="case-' + i + '">' +
          '<h3>' + esc(w.title) + '</h3><span class="case-result">' + esc(w.stat) + '</span><span class="case-icon" aria-hidden="true"></span></button>' +
          '<div class="case-panel" id="case-' + i + '"><div><div class="case-body">' +
          '<div><h4>The question</h4><p>' + esc(w.q) + '</p></div>' +
          '<div><h4>What I did</h4><p>' + esc(w.how) + '</p></div>' +
          '<div><h4>The result</h4><p>' + esc(w.out) + '</p></div>' +
          '</div></div></div></li>';
      }).join("") + '</ul></div></section>';
  },
  function () {
    return '<section class="work"><div class="wrap"><h2 class="work-title">Selected work</h2><ul class="cards">' +
      WORK.map(function (w) {
        return '<li class="card"><span class="livery" aria-hidden="true"><i></i><i></i></span><span class="area">' + esc(w.area) + '</span>' +
          '<h3>' + esc(w.title) + '</h3><p>' + esc(w.line) + '</p>' +
          '<p class="stat">' + esc(w.stat) + '<small>' + esc(w.statLabel) + '</small></p></li>';
      }).join("") + '</ul><p class="rail-hint">Swipe to see all three.</p></div></section>';
  }
];

/* Accordion for "Dossier". Delegated, so it survives re-mounts. */
document.getElementById("stage").addEventListener("click", function (e) {
  var t = e.target.closest(".case-toggle"); if (!t) return;
  var open = t.getAttribute("aria-expanded") !== "true";
  t.setAttribute("aria-expanded", open ? "true" : "false");
  document.getElementById(t.getAttribute("aria-controls")).toggleAttribute("data-open", open);
});

/* ---------- Picker wiring: verbatim from PICKER.md (no replay: no variant has an entrance to re-run) ---------- */
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;
function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}
function mount(i) {
  stage.innerHTML = '';
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
</html>
