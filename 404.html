<style>
  :root {
    --surface: #111111; --raised: #1A1A1A; --text: #F5F5F5; --muted: #A3A3A3;
    --line: #2A2A2A; --primary: #0077BC; --secondary: #009866;
    --display: "Archivo Black", "Arial Black", Impact, sans-serif;
    --body: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    display: flex; flex-direction: column; min-height: 100vh; min-height: 100svh;
    background: var(--surface); color: var(--text);
    font-family: var(--body); font-size: 1.0625rem; line-height: 1.55;
  }
  a { color: inherit; }
  a:focus-visible { outline: 3px solid var(--text); outline-offset: 4px; }
  .wrap { width: min(1200px, 100% - 2 * max(clamp(1.25rem, 4vw, 3rem), env(safe-area-inset-left, 0px), env(safe-area-inset-right, 0px))); margin-inline: auto; }
  .top { padding-block: 1.5rem; }
  .mark {
    display: inline-flex; align-items: center; gap: .6rem; min-height: 44px;
    font-family: var(--display); font-size: 1.5rem; letter-spacing: -.01em; text-decoration: none;
  }
  .livery { display: inline-flex; gap: .2rem; }
  .livery i { display: block; width: .5rem; height: 1.35rem; transform: skewX(-18deg); }
  .livery i:first-child { background: var(--primary); }
  .livery i:last-child { background: var(--secondary); }
  main { flex: 1; padding-block: clamp(2rem, 6vw, 4.5rem); }
  h1 {
    font-family: var(--display); font-weight: 400; letter-spacing: -.03em; line-height: .9;
    font-size: clamp(2.5rem, 11vw, 8rem); margin-bottom: clamp(1.5rem, 4vw, 2.5rem); text-wrap: balance;
  }
  h1 .livery { gap: .08em; margin-left: .2em; }
  h1 .livery i { width: .3em; height: .66em; }
  p { max-width: 40ch; font-size: clamp(1.15rem, 1.7vw, 1.45rem); line-height: 1.45; font-weight: 500; text-wrap: pretty; }
  .links { display: flex; flex-wrap: wrap; gap: .75rem 2rem; margin-top: 2rem; }
  .links a {
    display: inline-flex; align-items: center; min-height: 44px;
    font-weight: 700; text-decoration: none; border-bottom: 2px solid var(--primary);
  }
  @media (hover: hover) and (pointer: fine) { .links a:hover { border-color: var(--text); } }
  .el { margin-top: 3rem; padding-top: 1.25rem; border-top: 1px solid var(--line); color: var(--muted); font-family: "Commissioner", var(--body); font-size: 1rem; }
  .el a { color: var(--text); text-underline-offset: 3px; }
  footer { padding-block: 1.5rem; border-top: 1px solid var(--line); font-size: .875rem; color: var(--muted); }

  /* ---------- Phones ---------- */
  /* No grey flash on tap (every control has its own :active), no font inflation in landscape */
  html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  /* Taps fire straight away, with no double-tap-zoom wait */
  button, a { touch-action: manipulation; }
  /* Long-pressing a control doesn't select its label. Content, including the email address, stays selectable */
  button, .mark, .top-link, .nav-link, .lang { -webkit-user-select: none; user-select: none; }
  /* Press feedback for text links */
  .mark:active, .top-link:active, .nav-link:active, .lang:active, .foot-links a:active, .linkish:active, .contact a:active, .links a:active { opacity: .7; }
  /* Landscape on a notched phone: colour runs edge to edge, content stays clear of the notch */
  footer { padding-bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px)); }

  /* ================= Brand layer: Gkanaroglou, Nu-Brutalism =================
     Paper ground, Black type and rules, one Signal Orange block per screen, Cobalt sparingly.
     Inter Tight does everything. Structure is the decoration: rules, never boxes, shadows or rounded cards. */
  :root {
    --surface: #F5F5F2;   /* Paper */
    --raised: #D9D9D4;    /* Concrete: quiet fills */
    --text: #000000;      /* Black */
    --muted: #4D4D49;     /* Black at about 70% on Paper, for secondary text (8:1) */
    --line: #D9D9D4;      /* Concrete: quiet dividers */
    --rule: #000000;      /* the 3px rule that opens each block */
    --primary: #FF4F12;   /* Signal Orange: black text on it, never Paper */
    --secondary: #1E36FF; /* Cobalt */
    --display: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
    --body: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  body { font-weight: 500; line-height: 1.45; }
  ::selection { background: var(--primary); color: #000; }

  /* Type: one family, heavy and tight for display */
  h1 { font-weight: 900; letter-spacing: -.045em; line-height: .9; }
  h2, .quiz-q, .result h2, .browse h2 { font-weight: 800; letter-spacing: -.03em; }
  h3, .pick h3 { font-weight: 700; letter-spacing: -.01em; }

  /* Header: the wordmark top left, a black rule beneath */
  .top { padding-block: 1rem; border-bottom: 3px solid var(--rule); }
  .mark img { display: block; height: 22px; width: auto; }
  @media (max-width: 420px) { .mark img { height: 18px; } }
  .lang { color: var(--muted); }
  .nav-link { font-weight: 700; border-bottom: 3px solid transparent; }
  .nav-link[aria-current="page"] { border-color: var(--primary); }
  .top-link { padding: .5rem 1rem; font-weight: 700; color: var(--surface); background: var(--text); border: 0; transition: background-color 150ms ease, color 150ms ease; }
  @media (hover: hover) and (pointer: fine) {
    .nav-link:hover { border-color: var(--rule); }
    .top-link:hover { color: #000; background: var(--primary); }
  }

  /* Buttons: square, black-ruled, no shadows */
  .btn { border: 2px solid var(--rule); color: var(--text); background: transparent; transition: transform 160ms cubic-bezier(0.23, 1, 0.32, 1), background-color 150ms ease, color 150ms ease; }
  .btn-primary { color: #000; background: var(--primary); border-color: var(--rule); }
  @media (hover: hover) and (pointer: fine) { .btn:hover { color: var(--surface); background: var(--text); } }

  /* Footer */
  footer { border-top: 3px solid var(--rule); color: var(--muted); }
  .foot-links a, .linkish { color: var(--text); }

  /* Cookie banner: a solid black block */
  .consent { color: var(--surface); background: var(--text); border: 0; padding: 1.25rem 1.5rem; }
  .consent a { color: var(--surface); }
  .consent .btn { color: var(--surface); border-color: var(--surface); }
  .consent .btn-primary { color: #000; background: var(--primary); border-color: var(--primary); }
  .consent .btn:focus-visible, .consent a:focus-visible { outline-color: var(--surface); }
  @media (hover: hover) and (pointer: fine) {
    .consent .btn:hover { color: #000; background: var(--surface); border-color: var(--surface); }
  }

  .links a { border-bottom: 3px solid var(--rule); }
  @media (hover: hover) and (pointer: fine) { .links a:hover { border-color: var(--primary); } }
</style>
