<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="cache-control" content="no-cache">
<title>LSE files | George Kanaroglou</title>
<meta name="theme-color" content="#F5F5F2">
<meta name="color-scheme" content="light">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  /* Inter Tight, served from this site. SIL Open Font License: see /assets/fonts/OFL.txt */
  @font-face {
    font-family: "Inter Tight";
    src: url("/assets/fonts/inter-tight.woff2") format("woff2");
    font-weight: 500 900; font-style: normal; font-display: swap;
  }

  /* Gkanaroglou brand, Nu-Brutalism. Paper, Black, Signal Orange. One loud field per screen.
     Structure is the decoration: 3px black rules, no boxes, shadows or rounded corners. */
  :root {
    --paper: #F5F5F2;
    --black: #000000;
    --orange: #FF4F12;   /* black text on it, never Paper */
    --concrete: #D9D9D4;
    --muted: #4D4D49;
    --font: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
    --gutter: max(clamp(1.25rem, 4vw, 3rem), env(safe-area-inset-left, 0px), env(safe-area-inset-right, 0px));
    --content: min(1200px, 100% - 2 * var(--gutter));
    --head: 4.75rem;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    color-scheme: light;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
         scroll-padding-top: calc(var(--head) + env(safe-area-inset-top, 0px) + 1rem); }
  body {
    display: flex; flex-direction: column; min-height: 100vh; min-height: 100svh;
    background: var(--paper); color: var(--black);
    font-family: var(--font); font-size: 1.0625rem; font-weight: 500; line-height: 1.45;
  }
  main { flex: 1; }
  main:focus { outline: none; }
  a { color: inherit; text-underline-offset: 3px; }
  a, button { touch-action: manipulation; }
  button, input { font: inherit; color: inherit; }
  button { -webkit-user-select: none; user-select: none; cursor: pointer; }
  a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--black); outline-offset: 3px; }
  ::selection { color: #000; background: var(--orange); }
  h1, h2, h3 { text-wrap: balance; }
  p { text-wrap: pretty; }
  [hidden] { display: none !important; }
  .wrap { width: var(--content); margin-inline: auto; }
  .skip-link { position: absolute; z-index: 20; left: var(--gutter); top: -4rem; padding: .6rem 1rem; color: var(--paper); background: var(--black); font-weight: 700; text-decoration: none; }
  .skip-link:focus { top: .75rem; outline: 3px solid var(--orange); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* ---------- Header: the site's own, with Sign out on the right ---------- */
  .top { position: sticky; top: 0; z-index: 5; padding-top: env(safe-area-inset-top, 0px);
         background: var(--paper); border-bottom: 3px solid var(--black); }
  .top .wrap { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; column-gap: 1rem; padding-block: 1rem; }
  .site-nav { grid-column: 1; justify-self: start; display: flex; align-items: center; column-gap: 1.1rem; }
  .mark { grid-column: 2; justify-self: center; display: inline-flex; align-items: center; min-height: 44px; }
  .mark svg { display: block; height: 30px; width: auto; fill: currentColor; }
  .top-nav { grid-column: 3; justify-self: end; display: flex; align-items: center; }
  .site-link { display: inline-flex; align-items: center; min-height: 44px; font-size: .95rem; font-weight: 700; text-decoration: none;
               border-bottom: 3px solid transparent; transition: border-color 150ms ease; }
  .site-link[aria-current="page"] { border-color: var(--black); }
  .top-link { display: inline-flex; align-items: center; min-height: 44px; padding: .5rem 1rem; border: 0; font-weight: 700;
              color: var(--paper); background: var(--black); transition: color 150ms ease, background-color 150ms ease; }
  .site-link:active, .top-link:active, .mark:active { opacity: .7; }
  @media (any-hover: hover) and (any-pointer: fine) {
    .site-link:hover { border-color: var(--black); }
    .top-link:hover { color: #000; background: var(--orange); }
  }
  @media (max-width: 640px) { .site-nav .sn-wide { display: none; } }
  @media (max-width: 420px) { .mark svg { height: 26px; } .top-link { padding-inline: .7rem; font-size: .95rem; } }

  /* ---------- Shared pieces ---------- */
  .page { width: var(--content); margin-inline: auto; padding-block: clamp(1.75rem, 4vw, 3rem) clamp(3rem, 7vw, 5rem); }
  .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: .1rem .5rem; margin-bottom: 1.25rem; font-size: .9rem; font-weight: 600; color: var(--muted); }
  .crumbs a { display: inline-flex; align-items: center; min-height: 32px; color: var(--black); }
  .crumbs span[aria-hidden] { color: var(--concrete); font-weight: 800; }
  .crumbs [aria-current] { color: var(--muted); }
  .muted { color: var(--muted); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
    min-height: 44px; padding: .55rem 1.2rem; font-weight: 700; text-decoration: none;
    color: var(--black); background: transparent; border: 2px solid var(--black);
    transition: transform 160ms var(--ease-out), background-color 150ms ease, border-color 150ms ease;
  }
  .btn:active { transform: scale(0.97); transition-duration: 100ms; }
  .btn:disabled { opacity: .35; cursor: default; transform: none; }
  .btn-primary { background: var(--orange); border-color: var(--orange); }
  @media (any-hover: hover) and (any-pointer: fine) {
    .btn:not(:disabled):hover { background: var(--black); color: var(--paper); border-color: var(--black); }
    .btn-primary:not(:disabled):hover { color: #000; background: var(--paper); border-color: var(--black); }
  }
  .linkish { display: inline-flex; align-items: center; min-height: 44px; padding: 0; border: 0; background: none;
             font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  .linkish:active { opacity: .7; }
  .field { display: block; width: 100%; min-height: 52px; padding: .7rem .9rem; border: 2px solid var(--black); border-radius: 0;
           background: var(--paper); font-weight: 600; -webkit-appearance: none; appearance: none; }
  .field::placeholder { color: var(--muted); font-weight: 500; }
  .field:focus { outline: 3px solid var(--orange); outline-offset: 0; }
  .label { display: block; margin-bottom: .45rem; font-size: .95rem; font-weight: 700; }
  .tag { flex: none; display: inline-grid; place-items: center; min-width: 3.1rem; height: 1.6rem; padding: 0 .4rem;
         color: var(--paper); background: var(--black); font-size: .78rem; font-weight: 800; letter-spacing: .01em; }
  .tag.t-pdf { color: #000; background: var(--concrete); }

  /* ---------- Starting and locked ---------- */
  .starting { min-height: 50vh; display: grid; place-items: center; }
  .starting i { width: 14px; height: 14px; background: var(--black); animation: blink 900ms steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  .lock { width: min(40rem, 100% - 2 * var(--gutter)); margin-inline: auto; padding-block: clamp(3rem, 10vh, 6rem) 4rem; }
  .lock h1 { font-size: clamp(3rem, 10vw, 6rem); font-weight: 900; line-height: .88; letter-spacing: -.045em; }
  .lock > p { margin-top: 1.1rem; max-width: 40ch; color: var(--muted); }
  .lock form { margin-top: 2.25rem; padding-top: 1.25rem; border-top: 3px solid var(--black); }
  .lock-row { display: flex; gap: .75rem; }
  .lock-row .field { flex: 1; min-width: 0; }
  .lock-row .btn { min-height: 52px; }
  .check { display: inline-flex; align-items: center; gap: .6rem; min-height: 44px; margin-top: .75rem; font-size: .95rem; font-weight: 600; cursor: pointer; }
  .check input { width: 1.15rem; height: 1.15rem; accent-color: var(--black); }
  .error { min-height: 1.5rem; margin-top: .5rem; font-weight: 700; }
  .lock .back { margin-top: 2rem; font-size: .95rem; }
  @media (max-width: 480px) { .lock-row { flex-direction: column; } }

  /* ---------- Dashboard ---------- */
  .dash-head { display: grid; grid-template-columns: 1fr minmax(16rem, 26rem); align-items: end; gap: 1.5rem 3rem; }
  .dash-head h1 { font-size: clamp(3rem, 9vw, 6.5rem); font-weight: 900; line-height: .86; letter-spacing: -.05em; }
  .dash-head p { margin-top: .9rem; color: var(--muted); }
  @media (max-width: 760px) { .dash-head { grid-template-columns: 1fr; } }

  .block-title { margin-top: clamp(2.25rem, 5vw, 3.5rem); padding-top: .7rem; border-top: 3px solid var(--black);
                 display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
                 font-size: 1.35rem; font-weight: 800; letter-spacing: -.02em; }
  .block-title.plain { padding-top: 0; border-top: 0; margin-bottom: .7rem; }
  .block-title.later { margin-top: clamp(2rem, 4vw, 3rem); }
  .block-title small { font-size: .9rem; font-weight: 600; color: var(--muted); letter-spacing: 0; }

  /* Courses: a ruled timetable of course codes. Hovering one turns it into the screen's orange field. */
  /* Rules between cards: each card draws its own left rule over its neighbour's edge; the first column's is clipped */
  .courses { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 17rem), 1fr));
             overflow: hidden; border-bottom: 3px solid var(--black); }
  .courses li { display: flex; margin-left: -3px; border-left: 3px solid var(--black); }
  .course-link { flex: 1; display: flex; flex-direction: column; gap: .35rem; min-height: 12.5rem; padding: 1.1rem 1.1rem 1.25rem;
                 text-decoration: none; border-top: 3px solid var(--black); transition: background-color 150ms ease; }
  .course-code { font-size: clamp(2.6rem, 5vw, 3.6rem); font-weight: 900; line-height: .9; letter-spacing: -.05em; }
  .course-title { font-size: 1.1rem; font-weight: 700; line-height: 1.25; }
  .course-meta { margin-top: auto; font-size: .9rem; font-weight: 600; color: var(--muted); }
  .course-link:active { opacity: .8; }
  @media (max-width: 520px) { .course-link { min-height: 8.5rem; } }
  .course-link:focus-visible { outline-offset: -6px; }
  @media (any-hover: hover) and (any-pointer: fine) {
    .course-link:hover { background: var(--orange); }
    .course-link:hover .course-meta { color: #000; }
  }

  /* File rows, used for recent files, search results and course sections */
  .rows { list-style: none; }
  .row { display: flex; align-items: center; gap: .9rem; min-height: 3.5rem; padding-block: .45rem; border-bottom: 1px solid var(--concrete); }
  .row-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: .9rem; min-height: 44px; padding: 0; border: 0; background: none; text-align: left; text-decoration: none; }
  .row-text { min-width: 0; }
  .row-title { display: block; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
  .row-sub { display: block; margin-top: .1rem; font-size: .85rem; font-weight: 600; color: var(--muted); }
  .row-size { flex: none; font-size: .85rem; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row-dl { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border: 0; background: none; }
  .row-dl svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.25; stroke-linecap: square; }
  .row-main:active, .row-dl:active { opacity: .7; }
  @media (any-hover: hover) and (any-pointer: fine) {
    .row-main:hover .row-title { text-decoration: underline; text-underline-offset: 3px; }
    .row-dl:hover { color: var(--paper); background: var(--black); }
  }
  @media (max-width: 520px) { .row-size { display: none; } }
  .empty { padding-block: 1.5rem; color: var(--muted); font-weight: 600; }
  .more { margin-top: .75rem; }

  /* ---------- Course page ---------- */
  .course-hero { background: var(--orange); border-bottom: 3px solid var(--black); }
  .course-hero .page { padding-block: clamp(1.25rem, 3vw, 2rem) clamp(1.75rem, 4vw, 2.75rem); }
  .course-hero .crumbs, .course-hero .crumbs [aria-current] { color: #000; }
  .course-hero .crumbs span[aria-hidden] { color: #000; opacity: .45; }
  .hero-code { display: block; font-size: clamp(4rem, 15vw, 10.5rem); font-weight: 900; line-height: .8; letter-spacing: -.06em; }
  .hero-title { display: block; margin-top: .9rem; max-width: 30ch; font-size: clamp(1.35rem, 3vw, 2rem); font-weight: 800; line-height: 1.1; letter-spacing: -.02em; }
  .hero-meta { margin-top: .6rem; font-weight: 600; }
  .hero-note { margin-top: .6rem; max-width: 60ch; }

  .course-body { display: grid; grid-template-columns: 15.5rem minmax(0, 1fr); gap: clamp(1.5rem, 4vw, 3.5rem); align-items: start; }
  .index { position: sticky; top: calc(var(--head) + env(safe-area-inset-top, 0px) + 1.25rem);
           max-height: calc(100svh - var(--head) - 2.5rem); overflow: auto; overscroll-behavior: contain; padding: 3px 3px 1rem 0; }
  .index summary { list-style: none; display: none; }
  .index summary::-webkit-details-marker { display: none; }
  .index-title { padding-top: .7rem; border-top: 3px solid var(--black); font-size: 1rem; font-weight: 800; }
  .index ol { list-style: none; margin-top: .4rem; }
  .index a { display: flex; justify-content: space-between; gap: .75rem; min-height: 40px; align-items: center; padding: .25rem 0 .25rem .75rem;
             border-left: 3px solid transparent; font-size: .95rem; font-weight: 600; text-decoration: none; line-height: 1.25; }
  .index a span { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
  .index a.is-here { border-color: var(--black); font-weight: 800; }
  @media (any-hover: hover) and (any-pointer: fine) { .index a:hover { border-color: var(--concrete); } .index a.is-here:hover { border-color: var(--black); } }
  .filter { margin-top: .75rem; }
  .filter .field { min-height: 44px; padding-block: .5rem; font-size: .95rem; }

  .tools { display: flex; justify-content: flex-end; margin-top: -.5rem; }
  .section { margin-top: 1.25rem; }
  .section:first-of-type { margin-top: 0; }
  .sec-head { display: flex; align-items: center; gap: 1rem; width: 100%; min-height: 3.5rem; padding: .7rem 0 .6rem; border: 0;
              border-top: 3px solid var(--black); background: none; text-align: left; }
  .sec-head h2 { flex: 1; font-size: 1.35rem; font-weight: 800; line-height: 1.2; letter-spacing: -.02em; }
  .sec-count { flex: none; font-size: .9rem; font-weight: 600; color: var(--muted); }
  .caret { flex: none; width: .6rem; height: .6rem; margin: -.25rem .35rem 0 0; border-right: 3px solid currentColor; border-bottom: 3px solid currentColor;
           transform: rotate(45deg); transition: transform 160ms var(--ease-out); }
  .sec-head[aria-expanded="false"] .caret { transform: rotate(-45deg); margin-top: 0; }
  .sec-note { margin: -.1rem 0 .4rem; max-width: 65ch; color: var(--muted); }
  .group { padding: 1.4rem 0 .45rem; font-size: 1.05rem; font-weight: 800; line-height: 1.3; letter-spacing: -.01em; border-bottom: 2px solid var(--black); }
  .rows > .group:first-child { padding-top: .6rem; }
  .intro { padding: .7rem 0 .2rem; max-width: 68ch; color: var(--muted); font-size: .95rem; }
  .intro p + p, .fb p + p { margin-top: .6rem; }
  .intro a, .fb a { color: var(--black); overflow-wrap: anywhere; }
  .intro.is-long .intro-text { max-height: 6.6em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent); }
  .intro.is-long.is-open .intro-text { max-height: none; -webkit-mask-image: none; mask-image: none; }
  .intro .more-toggle { min-height: 40px; font-size: .9rem; color: var(--black); }
  .sub { padding: .9rem 0 .3rem; font-size: .85rem; font-weight: 800; color: var(--muted); border-bottom: 1px solid var(--concrete); }
  .fb { padding: .75rem 0; border-bottom: 1px solid var(--concrete); }
  .fb blockquote { max-width: 68ch; padding: .1rem 0 .1rem 1rem; border-left: 3px solid var(--black); font-size: .95rem; }

  @media (max-width: 900px) {
    .course-body { grid-template-columns: 1fr; }
    .index { position: static; max-height: none; overflow: visible; padding: 0; border-top: 3px solid var(--black); border-bottom: 3px solid var(--black); }
    .index summary { display: flex; justify-content: space-between; align-items: center; min-height: 52px; font-weight: 800; cursor: pointer; }
    .index[open] summary .caret { transform: rotate(225deg); margin-top: .3rem; }
    .index:not([open]) summary .caret { transform: rotate(45deg); }
    .index .index-title { display: none; }
    .index ol { margin: 0 0 .75rem; }
    .filter { margin: 0 0 .5rem; }
  }

  /* ---------- Viewer ---------- */
  .viewer h1 { font-size: clamp(1.7rem, 4vw, 2.75rem); font-weight: 900; line-height: 1; letter-spacing: -.035em; overflow-wrap: anywhere; }
  .viewer .file-group { margin-top: .7rem; max-width: 70ch; font-weight: 700; }
  .viewer .file-group + .file-meta { margin-top: .2rem; }
  .viewer .file-meta { margin-top: .6rem; font-weight: 600; color: var(--muted); overflow-wrap: anywhere; }
  .bar { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.25rem; }
  .bar .spacer { flex: 1; }
  .stage { position: relative; margin-top: 1.25rem; border: 3px solid var(--black); background: #fff;
           height: calc(100svh - var(--head) - 9rem); min-height: 26rem; }
  .stage iframe, .stage video { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
  .stage.fit { height: auto; min-height: 0; }
  .stage img { display: block; max-width: 100%; margin-inline: auto; }
  .stage pre { max-height: 75svh; overflow: auto; padding: 1rem; font: 500 .9rem/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  .stage audio { display: block; width: 100%; }
  .stage-msg { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 1rem; padding: 1.5rem; text-align: center; background: var(--paper); }
  .stage.fit .stage-msg { position: static; min-height: 16rem; }
  .stage-msg p { max-width: 34ch; font-weight: 700; }
  .progress { width: min(18rem, 70vw); height: 8px; background: var(--concrete); }
  .progress i { display: block; height: 100%; width: 0; background: var(--black); transition: width 200ms ease; }
  @media (max-width: 600px) { .bar .btn { flex: 1 1 calc(50% - .3rem); } .bar .spacer { display: none; } }

  /* ---------- Footer ---------- */
  footer { padding-block: 1.5rem calc(1.5rem + env(safe-area-inset-bottom, 0px)); border-top: 3px solid var(--black); font-size: .875rem; color: var(--muted); }
  .foot { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .5rem 1.5rem; }
  .foot a { color: var(--black); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 1ms !important; animation-duration: 1ms !important; }
  }
</style>
</head>

  <div class="wrap">
    <nav class="site-nav" aria-label="Site">

(function () {

  var ICON_DL = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3v12M6 10l6 6 6-6M4 21h16"/></svg>';

  var MIME = { pdf: "application/pdf", png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", jpe: "image/jpeg", html: "text/html", htm: "text/html", gif: "image/gif", webp: "image/webp", svg: "image/svg+xml",
               txt: "text/plain", csv: "text/csv", md: "text/plain", json: "application/json", mp4: "video/mp4", m4v: "video/mp4", webm: "video/webm",
               mov: "video/quicktime", mp3: "audio/mpeg", m4a: "audio/mp4", wav: "audio/wav",
               docx: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
               pptx: "application/vnd.openxmlformats-officedocument.presentationml.presentation",
               xlsx: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" };
  var TEXT = ["txt", "csv", "md", "json", "r", "py", "sql", "tex", "log", "do", "rmd", "bib"];
  function kind(ext) {

    if (["png", "jpg", "jpeg", "jpe", "gif", "webp", "svg"].indexOf(ext) > -1) return "image";
    if (ext === "html" || ext === "htm") return "html";
    if (["mp4", "m4v", "webm", "mov"].indexOf(ext) > -1) return "video";
    if (["mp3", "m4a", "wav"].indexOf(ext) > -1) return "audio";
    if (TEXT.indexOf(ext) > -1) return "text";

  }
  var ROLE = { submission: "Your submission", feedback: "Feedback" };
  function safeName(s) { return String(s).replace(/[\\/:*?"<>|]+/g, " ").replace(/\s+/g, " ").trim(); }
  // Moodle descriptions and feedback arrive as plain text: paragraphs, line breaks and bare links
  function prose(t) {
    return String(t).split(/\n{2,}/).map(function (p) {
      var h = esc(p).replace(/\n/g, "<br>").replace(/(https?:\/\/[^\s<()]+[^\s<().,;:!?'"])/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
      return "<p>" + h + "</p>";

  }

    return fold(base.replace(/[^a-z0-9…&]+/gi, "")) !== fold(it.title.replace(/[^a-z0-9…&]+/gi, ""));
  }

  // ---------- crypto
  async function keyFromCode(code) {
    var base = await crypto.subtle.importKey("raw", enc.encode(code), "PBKDF2", false, ["deriveBits"]);
    var bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64d(meta.salt), iterations: meta.iter }, base, 256);

  }
  async function fetchBuf(path, fresh) {

    if (!r.ok) throw new Error("http " + r.status);

  // ---------- opening the files

    } catch (e) {

      try { var raw = await keyFromCode(handed.trim()); await tryKey(raw); remember(raw, false); return ready(); } catch (e) {}
    }
    var keys = [saved("session"), saved("local")];
    for (var i = 0; i < keys.length; i++) {

      catch (e) { if (!wrongCode(e)) { showLock("The files couldn’t be reached. Check your connection, then reload the page."); return; } }
    }

  }

  function showLock(msg) {

    $("lock-error").textContent = msg || "";

    } catch (x) {

      $("code").select();

  function ready() {
    starting.hidden = true; lock.hidden = true; app.hidden = false; signOut.hidden = false;

  // ---------- the course list, flattened once for search and previous/next
  function index() {
    byCourse = {}; flat = [];
    data.courses.forEach(function (c) {
      byCourse[c.id] = c; c.list = []; c.count = 0; c.bytes = 0;
      c.sections.forEach(function (s) {
        s.gmap = {}; (s.groups || []).forEach(function (g) { s.gmap[g.k] = g; });
        s.items.forEach(function (it) {
          it.course = c; it.section = s;
          it.grp = s.gmap[it.g] || null; it.group = it.grp ? it.grp.title : "";
          it.dlname = it.name.toLowerCase() === "combined.pdf" ? safeName(label(c) + " feedback, " + it.group).slice(0, 90) + ".pdf" : it.name;
          it.hay = fold([it.title, it.name, it.group, ROLE[it.r] || "", s.title, c.code, c.title].join(" "));
          c.list.push(it); flat.push(it); c.count++; c.bytes += it.size;
        });
      });
    });
  }
  // Words match anywhere; a number only matches a whole number, so "week 4" doesn't catch every MG4 course
  function matcher(q) {
    var terms = q.split(/\s+/).filter(Boolean);
    return function (it) {
      var tokens = null;
      return terms.every(function (w) {
        if (/^\d+$/.test(w)) { tokens = tokens || it.hay.split(/[^a-z0-9]+/); return tokens.indexOf(w) > -1; }
        return it.hay.indexOf(w) > -1;

  function link(it) { return "#" + it.course.id + "/f" + it.u; }
  function label(c) { return c.code || c.title; }

  // ---------- routes: #  |  #course  |  #course/s3  |  #course/f12
  addEventListener("hashchange", function () { if (data) route(); });
  function route() {
    viewToken++;
    if (spy) { spy.disconnect(); spy = null; }
    var h = decodeURIComponent(location.hash.slice(1)), m = h.match(/^([a-z0-9-]+)(?:\/(s|f)(\d+))?$/);

    if (m[2] === "f") {
      var it = find(c.id, +m[3]);

    }

  function paint(html, focusTop) {

  }

  // ---------- dashboard
  function dashboard() {
    var total = flat.reduce(function (a, it) { return a + it.size; }, 0);
    var recent = recentList();
    var html = '<div class="page">' +
      '<div class="dash-head"><div><h1>LSE files.</h1><p>' + plural(data.courses.length, "course", "courses") + ", " +
      plural(flat.length, "file", "files") + ", " + size(total) + ".</p></div>" +
      '<div><label class="label" for="search">Search all files</label>' +
      '<input class="field" id="search" type="search" placeholder="Try ‘conjoint’ or ‘week 4’" autocomplete="off" spellcheck="false"></div></div>' +
      '<div id="results" hidden></div>' +
      '<div id="home">' +
      terms().map(function (t, i) {
        return '<h2 class="block-title plain' + (i ? " later" : "") + '">' + esc(t.name) + '</h2><ul class="courses">' +
          t.courses.map(function (c) {
            return '<li><a class="course-link" href="#' + c.id + '"><span class="course-code">' + esc(label(c)) + "</span>" +
              (c.code ? '<span class="course-title">' + esc(c.title) + "</span>" : "") +
              '<span class="course-meta">' + plural(c.sections.length, "section", "sections") + ", " + plural(c.count, "file", "files") + "</span></a></li>";

      (recent.length ? '<h2 class="block-title">Recently opened</h2><ul class="rows">' + recent.map(row).join("") + "</ul>" : "") +
      "</div></div>";
    paint(html);
    var input = $("search"), res = $("results"), home = $("home"), t = null;
    var q0 = getItem("session", "gk-uni-q"); if (q0) { input.value = q0; run(); }
    input.addEventListener("input", function () { clearTimeout(t); t = setTimeout(run, 120); });
    function run() {
      var q = fold(input.value.trim());
      setItem("session", "gk-uni-q", input.value);
      if (!q) { res.hidden = true; home.hidden = false; return; }
      var hits = flat.filter(matcher(q));

  // Courses grouped by term, in the order the terms first appear
  function terms() {
    var out = [], seen = {};
    data.courses.forEach(function (c) {

      if (!seen[name]) { seen[name] = { name: name, courses: [] }; out.push(seen[name]); }

  }
  function row(it) {
    return '<li class="row"><a class="row-main" href="' + link(it) + '">' + tag(it.ext) +

  }

  // ---------- course page
  function fileRow(c, it) {
    return '<li class="row" data-g="' + esc(it.g) + '" data-hay="' + esc(it.hay) + '"><a class="row-main" href="' + link(it) + '">' + tag(it.ext) +

      (renamed(it) && it.name.toLowerCase() !== "combined.pdf" ? '<span class="row-sub">' + esc(it.name) + "</span>" : "") + "</span></a>" +

      '<button type="button" class="row-dl" data-dl="' + esc(c.id + "/" + it.u) + '" aria-label="Download ' + esc(it.dlname) + '" title="Download">' + ICON_DL + "</button></li>";

  // A section, Moodle style: loose files first, then each activity or folder with its description,
  // its own files, your submission, and the feedback you got back
  function sectionRows(c, s) {

      var k = esc(g.k), byRole = function (r) { return mine.filter(function (it) { return (it.r || "") === r; }); };

      if (g.note) html += '<li class="intro extra" data-g="' + k + '">' + prose(g.note) + "</li>";
      if (g.intro) {

      html += byRole("").map(function (it) { return fileRow(c, it); }).join("");
      var sub = byRole("submission"), fb = byRole("feedback");
      if (sub.length) html += '<li class="sub extra" data-g="' + k + '">Your submission</li>' + sub.map(function (it) { return fileRow(c, it); }).join("");
      if (fb.length || g.feedback) {
        html += '<li class="sub extra" data-g="' + k + '">Feedback</li>';
        if (g.feedback) html += '<li class="fb extra" data-g="' + k + '"><blockquote>' + prose(g.feedback) + "</blockquote></li>";
        html += fb.map(function (it) { return fileRow(c, it); }).join("");
      }
    });
    return html;
  }
  function course(c, jump) {
    document.title = label(c) + " | LSE files";
    var state = collapsed[c.id] || (collapsed[c.id] = {});
    var html = '<div class="course-hero"><div class="page">' +
      '<nav class="crumbs" aria-label="Breadcrumb"><a href="#">Dashboard</a><span aria-hidden="true">/</span><span aria-current="page">' + esc(label(c)) + "</span></nav>" +
      '<h1><span class="hero-code">' + esc(label(c)) + "</span>" + (c.code ? '<span class="hero-title">' + esc(c.title) + "</span>" : "") + "</h1>" +
      '<p class="hero-meta">' + esc(c.term ? c.term + ". " : "") + plural(c.count, "file", "files") + ", " + size(c.bytes) + ".</p>" +
      (c.note ? '<p class="hero-note">' + esc(c.note) + "</p>" : "") + "</div></div>" +
      '<div class="page course-body">' +
      '<details class="index" id="index"><summary>Course index <i class="caret" aria-hidden="true"></i></summary>' +
      '<p class="index-title">Course index</p>' +
      '<div class="filter"><label class="sr-only" for="filter">Filter this course</label><input class="field" id="filter" type="search" placeholder="Filter this course" autocomplete="off" spellcheck="false"></div><ol>' +
      c.sections.map(function (s) { return '<li><a href="#' + c.id + "/" + s.id + '" data-sec="' + s.id + '">' + esc(s.title) + "<span>" + s.items.length + "</span></a></li>"; }).join("") +
      "</ol></details><div>" +
      '<div class="tools"><button type="button" class="linkish" id="toggle-all"></button></div>' +
      c.sections.map(function (s) {
        var open = !state[s.id], lastGroup = "";
        return '<section class="section" id="' + s.id + '" aria-labelledby="h-' + s.id + '">' +
          '<button type="button" class="sec-head" aria-expanded="' + open + '" aria-controls="b-' + s.id + '" data-toggle="' + s.id + '">' +
          '<h2 id="h-' + s.id + '">' + esc(s.title) + '</h2><span class="sec-count">' + plural(s.items.length, "file", "files") + '</span><i class="caret" aria-hidden="true"></i></button>' +
          '<div id="b-' + s.id + '"' + (open ? "" : " hidden") + ">" + (s.note ? '<p class="sec-note">' + esc(s.note) + "</p>" : "") +
          '<ul class="rows">' + sectionRows(c, s) + "</ul></div></section>";
      }).join("") + "</div></div>";
    paint(html, !jump);

    var idx = $("index");
    if (matchMedia("(min-width: 901px)").matches) idx.open = true;
    idx.querySelector("summary").addEventListener("click", function (e) { if (matchMedia("(min-width: 901px)").matches) e.preventDefault(); });

    function setAll() {
      var anyOpen = c.sections.some(function (s) { return !state[s.id]; });
      $("toggle-all").textContent = anyOpen ? "Collapse all" : "Expand all";
    }
    function setSec(id, open) {
      state[id] = !open;
      var b = app.querySelector('[data-toggle="' + id + '"]');
      b.setAttribute("aria-expanded", String(open)); $("b-" + id).hidden = !open;
    }
    setAll();
    $("toggle-all").addEventListener("click", function () {
      var open = !c.sections.some(function (s) { return !state[s.id]; });
      c.sections.forEach(function (s) { setSec(s.id, open); }); setAll();
    });
    app.querySelectorAll("[data-toggle]").forEach(function (b) {
      b.addEventListener("click", function () { setSec(b.dataset.toggle, b.getAttribute("aria-expanded") !== "true"); setAll(); });
    });
    app.querySelectorAll(".index a").forEach(function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault(); setSec(a.dataset.sec, true); setAll();
        history.replaceState(null, "", a.getAttribute("href"));
        $(a.dataset.sec).scrollIntoView({ block: "start" });
        if (!matchMedia("(min-width: 901px)").matches) idx.open = false;
        $("h-" + a.dataset.sec).parentNode.focus({ preventScroll: true });
      });
    });
    $("filter").addEventListener("input", function () {
      var q = fold(this.value.trim()), terms = q ? q.split(/\s+/) : [], test = matcher(q);
      c.sections.forEach(function (s) {
        var shown = 0, sec = $(s.id);
        sec.querySelectorAll(".row").forEach(function (r) {
          var ok = test({ hay: r.dataset.hay });
          r.hidden = !ok; if (ok) shown++;
        });
        var live = {};
        sec.querySelectorAll(".row").forEach(function (r) { if (!r.hidden) live[r.dataset.g] = true; });
        sec.querySelectorAll(".group").forEach(function (g) { g.hidden = terms.length > 0 && !live[g.dataset.g]; });
        sec.querySelectorAll(".extra").forEach(function (x) { x.hidden = terms.length > 0; });
        sec.hidden = terms.length > 0 && shown === 0;
        if (terms.length && shown) setSec(s.id, true);
      });
      setAll();
    });

    app.querySelectorAll(".more-toggle").forEach(function (b) {
      b.addEventListener("click", function () {
        var li = b.parentNode, open = li.classList.toggle("is-open");
        b.setAttribute("aria-expanded", String(open));
        b.textContent = open ? "Show less" : "Show the full description";
      });
    });
    // the course index follows the section you're reading
    var links = {}; app.querySelectorAll(".index a").forEach(function (a) { links[a.dataset.sec] = a; });
    if ("IntersectionObserver" in window) {
      spy = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (en.isIntersecting) {
            Object.keys(links).forEach(function (k) { links[k].classList.toggle("is-here", k === en.target.id); });
          }
        });
      }, { rootMargin: "-20% 0px -70% 0px" });
      c.sections.forEach(function (s) { spy.observe($(s.id)); });
    }
    if (jump && $(jump)) { setSec(jump, true); setAll(); requestAnimationFrame(function () { $(jump).scrollIntoView({ block: "start" }); }); }
  }

  // ---------- viewer
  function viewer(it) {
    var c = it.course, i = c.list.indexOf(it), prev = c.list[i - 1], next = c.list[i + 1], k = kind(it.ext);
    var phone = matchMedia("(pointer: coarse)").matches && innerWidth < 900;
    document.title = it.title + " | LSE files";
    pushRecent(it);
    paint('<div class="page viewer">' +
      '<nav class="crumbs" aria-label="Breadcrumb"><a href="#">Dashboard</a><span aria-hidden="true">/</span><a href="#' + c.id + '">' + esc(label(c)) + '</a><span aria-hidden="true">/</span>' +
      '<a href="#' + c.id + "/" + it.section.id + '">' + esc(it.section.title) + "</a></nav>" +
      "<h1>" + esc(it.title) + '</h1>' + (it.group ? '<p class="file-group">' + esc(it.group + (ROLE[it.r] ? ". " + ROLE[it.r] + "." : "")) + "</p>" : "") +
      '<p class="file-meta">' + esc(it.name) + ", " + size(it.size) + "</p>" +
      '<div class="bar">' +
      '<a class="btn" ' + (prev ? 'href="' + link(prev) + '" title="' + esc(prev.title) + '"' : 'aria-disabled="true" style="opacity:.35;pointer-events:none"') + ">Previous</a>" +
      '<a class="btn" ' + (next ? 'href="' + link(next) + '" title="' + esc(next.title) + '"' : 'aria-disabled="true" style="opacity:.35;pointer-events:none"') + ">Next</a>" +
      '<span class="spacer"></span>' +
      (k === "pdf" || k === "image" || k === "text" ? '<button type="button" class="btn" id="v-tab" disabled>Open full screen</button>' : "") +
      '<button type="button" class="btn btn-primary" id="v-dl" disabled>Download</button></div>' +
      '<div class="stage' + (k === "pdf" && !phone || k === "video" || k === "html" ? "" : " fit") + '" id="stage"><div class="stage-msg" id="stage-msg"><div class="progress"><i id="bar"></i></div><p id="stage-text">Opening</p></div></div></div>');

    var token = viewToken;
    load(it, function (done, total) {
      if (token !== viewToken) return;
      $("bar").style.width = Math.round(done / total * 100) + "%";
      if (total > 1) $("stage-text").textContent = "Opening part " + Math.min(done + 1, total) + " of " + total;
    }).then(function (entry) {
      if (token !== viewToken) return;
      var stage = $("stage"), dl = $("v-dl"), tab = $("v-tab");
      dl.disabled = false; dl.addEventListener("click", function () { save(entry.url, it.dlname); });
      if (tab) { tab.disabled = false; tab.addEventListener("click", function () { window.open(entry.url, "_blank"); }); }
      if (k === "pdf" && !phone) {
        stage.innerHTML = '<iframe src="' + entry.url + '" title="' + esc(it.title) + '"></iframe>';
      } else if (k === "pdf") {
        stage.innerHTML = '<div class="stage-msg"><p>Phones show PDFs best on their own. Open it full screen.</p><button type="button" class="btn btn-primary" id="v-open">Open full screen</button></div>';
        $("v-open").addEventListener("click", function () { window.open(entry.url, "_blank"); });
      } else if (k === "html") {
        entry.blob.text().then(function (t) {
          if (token !== viewToken) return;
          var f = document.createElement("iframe");
          f.setAttribute("sandbox", "allow-popups allow-popups-to-escape-sandbox");   // no scripts, no access to this page
          f.title = it.title; f.srcdoc = '<base target="_blank"><style>body{font:16px/1.5 Arial,sans-serif;margin:1.25rem;max-width:70ch}</style>' + t;
          stage.innerHTML = ""; stage.appendChild(f);
        });
      } else if (k === "image") {
        stage.innerHTML = '<img src="' + entry.url + '" alt="' + esc(it.title) + '">';
      } else if (k === "video") {
        stage.innerHTML = '<video src="' + entry.url + '" controls playsinline></video>';
      } else if (k === "audio") {
        stage.innerHTML = '<div style="padding:1rem"><audio src="' + entry.url + '" controls></audio></div>';
      } else if (k === "text" && it.size < 3 * 1024 * 1024) {
        entry.blob.text().then(function (t) { if (token === viewToken) { stage.innerHTML = "<pre></pre>"; stage.firstChild.textContent = t; } });
      } else {
        stage.innerHTML = '<div class="stage-msg"><p>' + esc(it.ext ? "." + it.ext + " files" : "This file") + " can’t be shown in the browser. Download it to open it.</p>" +
          '<button type="button" class="btn btn-primary" id="v-dl2">Download</button></div>';
        $("v-dl2").addEventListener("click", function () { save(entry.url, it.dlname); });
      }
    }, function () {
      if (token !== viewToken) return;
      $("stage-msg").innerHTML = "<p>This file couldn’t be opened. Check your connection, then try again.</p>" +
        '<button type="button" class="btn" id="v-retry">Try again</button>';
      $("v-retry").addEventListener("click", route);
    });
  }
  addEventListener("keydown", function (e) {
    if (!data || e.altKey || e.ctrlKey || e.metaKey || /input|textarea/i.test(e.target.tagName)) return;
    var m = location.hash.match(/^#([a-z0-9-]+)\/f(\d+)$/); if (!m) return;
    var it = find(m[1], +m[2]); if (!it) return;
    var list = it.course.list, i = list.indexOf(it);
    if (e.key === "ArrowLeft" && list[i - 1]) location.hash = link(list[i - 1]).slice(1);
    if (e.key === "ArrowRight" && list[i + 1]) location.hash = link(list[i + 1]).slice(1);
    if (e.key === "Escape") location.hash = it.course.id + "/" + it.section.id;
  });

  // ---------- fetching and decrypting, with a small in-memory cache
  async function load(it, progress) {
    var hit = cache.get(it.f);
    if (hit) { cache.delete(it.f); cache.set(it.f, hit); progress(1, 1); return hit; }
    var parts = new Array(it.p), done = 0, nextPart = 0;
    progress(0, it.p);
    async function worker() {
      while (nextPart < it.p) {
        var n = nextPart++, lab = it.f + "." + n;
        parts[n] = await openSealed(aes, await fetchBuf(lab + ".enc", false), lab);
        progress(++done, it.p);
      }
    }
    await Promise.all([worker(), worker(), worker()].slice(0, Math.min(3, it.p)));
    var blob = new Blob(parts, { type: MIME[it.ext] || "application/octet-stream" });
    var entry = { blob: blob, url: URL.createObjectURL(blob), size: blob.size };
    cache.set(it.f, entry); cacheSize += entry.size;
    while (cacheSize > CACHE_LIMIT && cache.size > 1) {
      var oldest = cache.keys().next().value, o = cache.get(oldest);
      URL.revokeObjectURL(o.url); cacheSize -= o.size; cache.delete(oldest);
    }
    return entry;
  }
  function save(url, name) {
    var a = document.createElement("a"); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  }
  app.addEventListener("click", function (e) {
    var b = e.target.closest("[data-dl]"); if (!b) return;
    var p = b.dataset.dl.split("/"), it = find(p[0], +p[1]); if (!it) return;
    b.disabled = true; b.setAttribute("aria-busy", "true");
    load(it, function () {}).then(function (entry) { save(entry.url, it.dlname); }, function () { alert("That file couldn’t be downloaded. Check your connection, then try again."); })
      .then(function () { b.disabled = false; b.removeAttribute("aria-busy"); });
  });

  // ---------- recently opened, kept on this device as course and file numbers only (no names)
  function recentList() {
    var out = [];
    try { (JSON.parse(getItem("local", "gk-uni-recent")) || []).forEach(function (r) { var p = r.split("/"), it = find(p[0], +p[1]); if (it) out.push(it); }); } catch (e) {}
    return out.slice(0, 6);
  }
  function pushRecent(it) {
    var id = it.course.id + "/" + it.u, list = [];
    try { list = JSON.parse(getItem("local", "gk-uni-recent")) || []; } catch (e) {}
    list = [id].concat(list.filter(function (x) { return x !== id; })).slice(0, 12);
    setItem("local", "gk-uni-recent", JSON.stringify(list));
  }

  if (!window.crypto || !crypto.subtle) { showLock("This browser can’t open encrypted files. Try an up-to-date Chrome, Safari, Edge or Firefox."); return; }
  start();
})();
